{% extends 'base.html' %}
{% load django_bootstrap5 %}
{% block title %}Вход — WebLearn{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card card-custom border-0 p-4 shadow-sm">

                <h2 class="fw-bold mb-4 text-center">
                    Вход
                </h2>

                <form method="post">

                    {% csrf_token %}

                    {% bootstrap_form form %}

                    <button type="submit"
                            class="btn btn-primary w-100 py-2">
                        Войти
                    </button>

                </form>

                <!-- ВХОД ДЛЯ УЧИТЕЛЯ -->
                <div class="text-center my-3 text-muted">
                    или
                </div>

                <a href="/admin/"
                   class="btn btn-outline-primary w-100 py-2">
                    🛡️ Войти как учитель
                </a>

                <p class="mt-4 mb-0 text-center text-muted small">
                    Нет аккаунта?
                    <a href="{% url 'accounts:register' %}">
                        Зарегистрироваться
                    </a>
                </p>

            </div>

        </div>
    </div>
</div>
{% endblock %}
